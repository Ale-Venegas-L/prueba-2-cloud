<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPedidos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <div class="contenedor">

        <h1>MiniPedidos</h1>
        <p class="subtitulo">
            Laboratorio Desarrollo Cloud
        </p>

        <form id="formPedido">

            <label for="cliente">Nombre del cliente</label>
            <input type="text" id="cliente" required placeholder="Ingrese nombre del cliente">

            <label for="producto">Producto</label>
            <select id="producto" required>
                <option value="">Seleccione un producto</option>
                <option value="Notebook">Notebook</option>
                <option value="Teclado">Teclado</option>
                <option value="Mouse">Mouse</option>
                <option value="Monitor">Monitor</option>
            </select>

            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" min="1" value="1" required>

            <button type="submit" id="btnEnviar">
                Enviar pedido
            </button>

        </form>

        <div id="resultado" role="status" aria-live="polite"></div>

    </div>
</body>

</html>
